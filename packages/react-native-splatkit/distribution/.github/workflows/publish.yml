name: publish

# Publishing runs from a tag so the released bytes come from a commit that exists. Tag with the
# version in package.json, e.g. `git tag v0.1.0-alpha.1 && git push --tags`.
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
          registry-url: "https://registry.npmjs.org"
          cache: npm
      - run: npm ci
      # Prereleases go to the next dist-tag, so `npm install` keeps resolving the latest stable version.
      - run: |
          version=$(node -p "require('./package.json').version")
          test "v$version" = "$GITHUB_REF_NAME"
          case "$version" in *-*) tag=next ;; *) tag=latest ;; esac
          npm publish --provenance --tag "$tag"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
