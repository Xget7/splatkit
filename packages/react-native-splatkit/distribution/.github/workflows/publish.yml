name: publish

# The version in package.json is the release trigger: a merge to main that names a version npm
# does not have yet publishes it, and a merge that does not is a no-op. That keeps the released
# bytes tied to a commit on main without anyone hand-tagging, and makes the release reviewable as
# an ordinary pull request. This repository is generated from the SplatKit monorepo, so the bump
# lands here through the mirror workflow there.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Queued/retried runs use the current main tree, so they cannot release an old bump.
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
          registry-url: "https://registry.npmjs.org"
          cache: npm
      # Trusted publishing authenticates with the job's OIDC token instead of a secret, and
      # npm accepts it for dist-tag changes from 11.21.0; Node 24.21.0 bundles 11.19.0.
      - run: npm install --global npm@11.21.0
      - run: npm ci

      - id: state
        name: Decide whether this version is new
        run: node scripts/release-state.cjs

      - run: npm run check

      # Prereleases go to the next dist-tag so a later stable release owns `latest` by default.
      - name: Publish to npm
        if: steps.state.outputs.new == 'true'
        run: npm publish --provenance --tag "$TAG"
        env:
          TAG: ${{ steps.state.outputs.tag }}

      # Until a stable release exists there is nothing for `latest` to mean, and leaving it on an
      # older prerelease makes plain `npm install` hand out a build no README describes. This runs
      # on every push so a tag left behind by an earlier release is corrected without a new version.
      - name: Point latest at the newest release while all of them are prereleases
        if: steps.state.outputs.promoteLatest == 'true'
        run: npm dist-tag add "$NAME@$VERSION" latest
        env:
          NAME: ${{ steps.state.outputs.name }}
          VERSION: ${{ steps.state.outputs.version }}

      - name: Tag the release commit
        run: |
          # npm may already have accepted the version before a previous job failed. Its
          # gitHead identifies the published source, even if main moved before this retry.
          sha=$(npm view "$NAME@$VERSION" gitHead)
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::npm did not report a release commit for $NAME@$VERSION"
            exit 1
          fi
          if ! git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            git fetch --depth 1 origin "$sha"
            git tag "v$VERSION" "$sha"
            git push origin "v$VERSION"
          fi
          # Not --prerelease, for the reason release.yml gives for the Android artifact: every
          # pre-1.0 release is a prerelease, and marking them all prerelease leaves the releases page
          # with no Latest at all.
          if ! gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release create "v$VERSION" --verify-tag --title "v$VERSION" --generate-notes
          fi
        env:
          NAME: ${{ steps.state.outputs.name }}
          VERSION: ${{ steps.state.outputs.version }}
          GH_TOKEN: ${{ github.token }}
