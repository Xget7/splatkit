android.useAndroidX=true
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
# Opt out of built-in kotlin and new DSL behavior that ships with AGP 9, matching
# apps/react-native-dev/android/gradle.properties; :adapter applies org.jetbrains.kotlin.android
# as an external plugin, which conflicts with AGP 9's built-in Kotlin support otherwise.
android.builtInKotlin=false
android.newDsl=false
