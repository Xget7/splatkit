name: lint

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded PR checks; preserve each main commit for the release and mirror gates.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Pull requests run only the jobs their files reach (.github/ci-filters.yml); main runs all.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      cpp-lint: ${{ steps.changes.outputs.cpp-lint }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github
      - id: changes
        uses: ./.github/actions/changes

  cpp:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.cpp-lint == 'true') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/android-sdk
        with:
          packages: "cmake;3.22.1"
      - name: clang-format and clang-tidy
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.1.12297006" scripts/lint-cpp.sh
