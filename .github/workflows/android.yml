name: splatkit-android

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0 ndk;27.1.12297006 cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the library and the dev app
        working-directory: apps/android-dev
        run: ./gradlew :splatkit:assembleRelease :app:assembleRelease --no-daemon
      - name: Keep the AAR
        uses: actions/upload-artifact@v4
        with:
          name: splatkit-android-release
          path: packages/splatkit-android/build/outputs/aar/*.aar
