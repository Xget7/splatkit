name: splatkit-rn-contract

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded PR checks; preserve each main commit for the release and mirror gates.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Pull requests run only the jobs their files reach (.github/ci-filters.yml); main runs all.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rn-package: ${{ steps.changes.outputs.rn-package }}
      rn-mirror: ${{ steps.changes.outputs.rn-mirror }}
      rn-android: ${{ steps.changes.outputs.rn-android }}
      rn-app: ${{ steps.changes.outputs.rn-app }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github
      - id: changes
        uses: ./.github/actions/changes

  contract:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.rn-package == 'true') }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: packages/react-native-splatkit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: packages/react-native-splatkit/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check

  # npm publishes from the mirror, where the package sits alone: a check that reaches into the
  # monorepo passes above and fails only at publish. Run it on the tree the mirror receives.
  mirror-tree:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.rn-mirror == 'true') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: packages/react-native-splatkit/package-lock.json
      - name: Check the exported package
        run: |
          directory=$(python3 scripts/export-ios-source.py --platform react-native \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['directory'])")
          cd "$directory"
          npm ci --ignore-scripts
          npm run check

  # JS contract checks do not compile the Kotlin adapter or execute its lifecycle state tests.
  android-adapter:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.rn-android == 'true') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: packages/react-native-splatkit/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: ./.github/actions/android-sdk
        with:
          packages: "platforms;android-36 build-tools;36.0.0 cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v6
      - run: npm ci --ignore-scripts
        working-directory: packages/react-native-splatkit
      - run: npm run patch:tooling
        working-directory: packages/react-native-splatkit
      - name: Compile Fabric bindings and test the adapter on host
        run: >
          apps/react-native/android/gradlew
          -p packages/react-native-splatkit/android/verification
          :adapter:compileDebugKotlin :adapter:testDebugUnitTest --no-daemon
      - name: Keep adapter test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-adapter-test-results
          path: packages/react-native-splatkit/android/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: error
          retention-days: 14

  metro-tooling:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.rn-app == 'true') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: |
            packages/react-native-splatkit/package-lock.json
            apps/react-native/package-lock.json
      - run: npm ci --ignore-scripts && npm run check
        working-directory: packages/react-native-splatkit
      - run: npm ci --ignore-scripts && npm run patch:tooling && npm run check:tooling && npm run typecheck
        working-directory: apps/react-native
      - name: Bundle both mobile platforms with patched Metro dependencies
        working-directory: apps/react-native
        run: |
          mkdir -p build/metro-security/ios build/metro-security/android
          npx react-native bundle --platform ios --dev false --entry-file index.js \
            --bundle-output build/metro-security/ios/main.jsbundle --assets-dest build/metro-security/ios
          npx react-native bundle --platform android --dev false --entry-file index.js \
            --bundle-output build/metro-security/android/index.android.bundle --assets-dest build/metro-security/android
