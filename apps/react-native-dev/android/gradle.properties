# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=512m
org.gradle.caching=true

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# This dev app targets one physical device (Xiaomi Mi 9, arm64) only.
reactNativeArchitectures=arm64-v8a

# New architecture (Fabric/TurboModules) and Hermes stay on: this app exists to exercise the
# Fabric prop/event path end to end.
newArchEnabled=true
hermesEnabled=true
edgeToEdgeEnabled=true

# Opt out of built-in kotlin and new DSL behavior that ships with AGP 9, matching the RN 0.87.1
# community template. Starting from AGP 10.x these opt outs will be removed.
android.builtInKotlin=false
android.newDsl=false
