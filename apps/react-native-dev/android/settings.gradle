pluginManagement {
    includeBuild("../node_modules/@react-native/gradle-plugin")
    // packages/splatkit-android applies this plugin (unversioned, via the modern `plugins {}`
    // DSL) for its Maven Central publishing config, which this app never invokes. AGP and
    // Kotlin are already resolvable here because their jars are already on this build's
    // classpath (see android/build.gradle); this one isn't, so it needs its version pinned
    // the same way apps/android-dev's root build.gradle.kts pins it.
    plugins {
        id "com.vanniktech.maven.publish" version "0.34.0"
    }
}
plugins { id("com.facebook.react.settings") }
extensions.configure(com.facebook.react.ReactSettingsExtension) { ex -> ex.autolinkLibrariesFromCommand() }

rootProject.name = "SplatKitRNDev"
include ":app"
includeBuild("../node_modules/@react-native/gradle-plugin")

// The splatkit native SDK, consumed directly like apps/android-dev does. The Fabric adapter
// module (packages/react-native-splatkit/android) declares `implementation project(':splatkit')`,
// so this name must match exactly in whatever root build includes it.
include ":splatkit"
project(":splatkit").projectDir = new File(rootDir, "../../../packages/splatkit-android")

// Autolinking reaches the adapter through the node_modules workspace symlink. Kotlin incremental
// compilation breaks after a build-cache restore through that path ("Cannot access ...: it is
// internal in file" on the next edit), so the module builds from its real path instead.
project(":splatkit_react-native").projectDir = new File(rootDir, "../../../packages/react-native-splatkit/android").canonicalFile
